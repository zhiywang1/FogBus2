<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Frames to WebSocket</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        #container {
            display: flex;
            justify-content: space-between;
            width: 75%;
        }

        #camera-container, #received-frame-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
        }

        video, .video {
            border: 2px solid #333;
            border-radius: 10px;
            height: 360px;
            width: 480px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 100%;
            max-height: 100%;
        }

        #controls {
            margin-bottom: 20px;
            text-align: center;
        }

        #stats, #video-quality {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div id="controls">
    <input type="text" id="ws-url" placeholder="ws://127.0.0.1:8765" size="30" value="ws://127.0.0.1:8765">

    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
    <button id="use-camera">Use Camera</button>
    <button id="load-video">Load Video</button>
    <input type="file" id="video-file" accept="video/*" style="display: none;">
    <button id="pause-resume">Pause</button>
</div>
<div id="container">
    <div id="camera-container">
        <video id="video" autoplay loop></video>
        <div id="left-quality">
            <p>Resolution: <span id="left-resolution">-</span></p>
            <p>Frame Size: <span id="left-frame-size">-</span> KB</p>
            <p>FPS: <span id="left-fps">0</span></p>
        </div>
    </div>
    <div id="received-frame-container">
        <div class="video">
            <img id="received-frame" alt="Received frame will be displayed here">
        </div>
        <div id="right-quality">
            <p>Resolution: <span id="right-resolution">-</span></p>
            <p>Frame Size: <span id="right-frame-size">-</span> KB</p>
            <p>FPS: <span id="right-fps">0</span></p>
        </div>
    </div>
</div>
<div id="stats">
    <p>Transfer Speed: <span id="transfer-speed">0</span> MB/s</p>
    <p>Response Time: <span id="response-time">0</span> ms</p> <!-- New element to display the response time -->
</div>

<script>
    let websocket;
    let sendFrameInterval;
    let currentStream = null;
    let receivedFrameCount = 0;
    let sentTime;
    let responseTimes = [];
    let sendFrames;
    let canSend = true;
    const update_interval = 1000;
    const maxWidth = 480;
    const maxHeight = 360;

    async function initCamera() {
        try {
            if (currentStream) {
                stopCurrentStream();
            }
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            currentStream = stream;
            const video = document.getElementById('video');
            video.srcObject = stream;
            return new Promise(resolve => {
                video.onloadedmetadata = () => resolve(video);
            });
        } catch (error) {
            console.error('Error accessing the camera:', error);
        }
    }

    function loadVideoFile(file) {
        try {
            if (currentStream) {
                stopCurrentStream();
            }
            const video = document.getElementById('video');
            const fileURL = URL.createObjectURL(file);
            video.srcObject = null;
            video.src = fileURL;
            console.log(file);
            return new Promise(resolve => {
                video.onloadedmetadata = () => resolve(video);
            });
        } catch (error) {
            console.error('Error accessing the video file:', error);
        }
    }

    function stopCurrentStream() {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
    }

    function connectWebSocket(video, url) {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d');

        websocket = new WebSocket(url);

        let lastFrameTime = performance.now();
        let frameCount = 0;
        let totalBytesSent = 0;
        let lastTransferSpeedUpdate = performance.now();

        websocket.onopen = () => {
            console.log('WebSocket connection opened');
            sendFrames(video, canvas, context);
            updateStats();
        };

        websocket.onmessage = (event) => {
            canSend = true;
            const receivedFrame = document.getElementById('received-frame');
            receivedFrame.src = event.data;
            updateRightQuality(event.data);
            receivedFrameCount++;
            const now = performance.now();
            const responseTime = now - sentTime;
            responseTimes.push(responseTime);
            if (responseTimes.length > 10) {
                responseTimes.shift();
            }
            const averageResponseTime = responseTimes.reduce((a, b) => a + b, 0) / responseTimes.length;
            if (now - lastFrameTime > update_interval) {
                document.getElementById('response-time').innerText = averageResponseTime.toFixed(2);
            }
        };

        websocket.onerror = (error) => {
            console.error('WebSocket error:', error);
        };

        websocket.onclose = () => {
            console.log('WebSocket connection closed');
            clearInterval(sendFrameInterval);
        };

        function updateStats() {
            const now = performance.now();
            const elapsedTime = now - lastFrameTime;
            if (elapsedTime >= update_interval) {
                const fps = frameCount / (elapsedTime / 1000);
                const receivedFps = receivedFrameCount / (elapsedTime / 1000);
                document.getElementById('left-fps').innerText = fps.toFixed(2); // Update left FPS
                document.getElementById('right-fps').innerText = receivedFps.toFixed(2); // Update right FPS
                frameCount = 0;
                receivedFrameCount = 0;
                lastFrameTime = now;
            }
            const transferElapsedTime = now - lastTransferSpeedUpdate;
            if (transferElapsedTime >= update_interval) {
                const transferSpeedMBps = (totalBytesSent / (1024 * 1024)) / (transferElapsedTime / 1000);
                document.getElementById('transfer-speed').innerText = transferSpeedMBps.toFixed(2);
                totalBytesSent = 0;
                lastTransferSpeedUpdate = now;
            }
            requestAnimationFrame(updateStats);
        }

        updateStats();

        sendFrames = function () {
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataURL = canvas.toDataURL('image/jpeg');
            const bytes = new TextEncoder().encode(dataURL).length;
            totalBytesSent += bytes;
            if (websocket.readyState === WebSocket.OPEN && canSend) {
                websocket.send(dataURL);
                canSend = false
                sentTime = performance.now();
                frameCount++;
                updateLeftQuality(canvas, bytes);
            }
        }

        sendFrameInterval = setInterval(sendFrames, update_interval / 30);
    }

    function updateLeftQuality(canvas, frameSizeBytes) {
        const resolution = `${canvas.width}x${canvas.height}`;
        const frameSizeKB = (frameSizeBytes / 1024).toFixed(2);
        document.getElementById('left-resolution').innerText = resolution;
        document.getElementById('left-frame-size').innerText = frameSizeKB;
    }

    function updateRightQuality(dataURL) {
        const img = new Image();
        img.onload = () => {
            const originalWidth = img.width;
            const originalHeight = img.height;

            img.height = maxHeight;
            const resolution = `${originalWidth}x${originalHeight}`;
            const frameSizeKB = (dataURL.length * 3 / 4 / 1024).toFixed(2); // Base64 to bytes
            document.getElementById('right-resolution').innerText = resolution;
            document.getElementById('right-frame-size').innerText = frameSizeKB;
        };
        img.src = dataURL;
    }

    document.getElementById('connect').addEventListener('click', async () => {
        const url = document.getElementById('ws-url').value;
        const video = document.getElementById('video');
        if (video.srcObject || video.src) {
            connectWebSocket(video, url);
        } else {
            console.log('No video source available. Use camera or load a video file first.');
        }
    });

    document.getElementById('disconnect').addEventListener('click', () => {
        if (websocket) {
            websocket.close();
        }
    });

    document.getElementById('use-camera').addEventListener('click', async () => {
        await initCamera();
    });

    document.getElementById('load-video').addEventListener('click', () => {
        document.getElementById('video-file').click();
    });

    document.getElementById('video-file').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (file) {
            await loadVideoFile(file);
        }
        event.target.value = '';
    });

    document.getElementById('pause-resume').addEventListener('click', () => {
        const button = document.getElementById('pause-resume');
        if (button.textContent === 'Pause') {
            clearInterval(sendFrameInterval);
            button.textContent = 'Resume';
        } else {
            sendFrameInterval = setInterval(sendFrames, update_interval / 30);
            button.textContent = 'Pause';
        }
    });


    window.addEventListener('load', () => {
    });
</script>
</body>
</html>
